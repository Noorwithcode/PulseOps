<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="PulseOps - Enterprise Monitoring and Incident Response Platform"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <title>PulseOps</title>

    <style>
      /* =====================================================
         PULSEOPS — INSTANT HARD-REFRESH BOOT SCREEN
         Starts before React / Vite finishes loading.
      ===================================================== */

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #050b10;
      }

      #pulseops-initial-loader {
        position: fixed;
        z-index: 2147483647;
        inset: 0;

        display: grid;
        place-items: center;

        overflow: hidden;

        color: #eef7f8;

        background:
          radial-gradient(
            circle at 50% 44%,
            rgba(35, 221, 215, 0.08),
            transparent 28%
          ),
          linear-gradient(
            180deg,
            #061018 0%,
            #04090d 100%
          );

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        opacity: 1;
        visibility: visible;

        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      #pulseops-initial-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .initial-loader-grid {
        position: absolute;
        inset: 0;

        opacity: 0.22;

        background-image:
          linear-gradient(
            rgba(55, 154, 166, 0.055) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(55, 154, 166, 0.055) 1px,
            transparent 1px
          );

        background-size: 42px 42px;
      }

      .initial-loader-center {
        position: relative;
        z-index: 2;

        width: min(360px, 88vw);

        display: flex;
        flex-direction: column;
        align-items: center;

        text-align: center;
      }

      .initial-loader-orbit {
        position: relative;

        width: 128px;
        height: 128px;

        display: grid;
        place-items: center;

        margin-bottom: 24px;
      }

      .initial-loader-ring {
        position: absolute;
        border-radius: 50%;
      }

      .initial-loader-ring.ring-one {
        inset: 0;

        border:
          1px solid
          rgba(35, 221, 215, 0.13);

        animation:
          initialPulseRing 2.4s
          ease-in-out infinite;
      }

      .initial-loader-ring.ring-two {
        inset: 12px;

        border:
          1px solid
          rgba(35, 221, 215, 0.1);

        border-top-color:
          rgba(35, 221, 215, 0.9);

        animation:
          initialPulseSpin 1.4s
          linear infinite;
      }

      .initial-loader-ring.ring-three {
        inset: 25px;

        border:
          1px solid
          rgba(70, 221, 163, 0.14);

        border-right-color:
          rgba(70, 221, 163, 0.7);

        animation:
          initialPulseSpinReverse 2.1s
          linear infinite;
      }

      .initial-loader-mark {
        position: relative;
        z-index: 3;

        width: 66px;
        height: 66px;

        display: grid;
        place-items: center;

        border:
          1px solid
          rgba(35, 221, 215, 0.28);

        border-radius: 18px;

        background:
          linear-gradient(
            145deg,
            rgba(35, 221, 215, 0.085),
            rgba(35, 221, 215, 0.025)
          );

        box-shadow:
          0 0 30px
          rgba(35, 221, 215, 0.09);
      }

      .initial-loader-mark svg {
        width: 42px;
        height: 42px;
        overflow: visible;
      }

      .initial-loader-heartbeat {
        fill: none;

        stroke: #23ddd7;
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;

        stroke-dasharray: 125;
        stroke-dashoffset: 125;

        animation:
          initialHeartbeat 1.35s
          ease-in-out infinite;
      }

      .initial-loader-brand {
        color: #eaf5f7;

        font-size: 22px;
        font-weight: 850;

        letter-spacing: 0.16em;
      }

      .initial-loader-brand span {
        color: #23ddd7;
      }

      .initial-loader-status {
        margin-top: 10px;

        color: #718990;

        font-size: 10px;
        font-weight: 700;

        letter-spacing: 0.16em;
      }

      .initial-loader-progress {
        width: 210px;
        height: 2px;

        margin-top: 20px;

        overflow: hidden;

        border-radius: 999px;

        background:
          rgba(124, 170, 182, 0.09);
      }

      .initial-loader-progress span {
        display: block;

        width: 42%;
        height: 100%;

        border-radius: inherit;

        background:
          linear-gradient(
            90deg,
            transparent,
            #23ddd7,
            #46dda3,
            transparent
          );

        animation:
          initialProgress 1.1s
          ease-in-out infinite;
      }

      .initial-loader-meta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        margin-top: 16px;

        color: #536b72;

        font-size: 8px;
        letter-spacing: 0.08em;
      }

      .initial-loader-meta strong {
        color: #8299a0;
      }

      .initial-loader-dot {
        width: 3px;
        height: 3px;

        border-radius: 50%;

        background: #46dda3;

        box-shadow:
          0 0 7px
          rgba(70, 221, 163, 0.55);
      }

      @keyframes initialPulseSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initialPulseSpinReverse {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes initialPulseRing {
        0%,
        100% {
          transform: scale(0.95);
          opacity: 0.35;
        }

        50% {
          transform: scale(1.04);
          opacity: 0.8;
        }
      }

      @keyframes initialHeartbeat {
        0% {
          stroke-dashoffset: 125;
          opacity: 0.35;
        }

        52% {
          stroke-dashoffset: 0;
          opacity: 1;
        }

        76% {
          stroke-dashoffset: 0;
          opacity: 1;
        }

        100% {
          stroke-dashoffset: -125;
          opacity: 0.35;
        }
      }

      @keyframes initialProgress {
        from {
          transform: translate3d(-145%, 0, 0);
        }

        to {
          transform: translate3d(345%, 0, 0);
        }
      }

      @media (max-width: 600px) {
        .initial-loader-orbit {
          width: 112px;
          height: 112px;
        }

        .initial-loader-brand {
          font-size: 19px;
        }

        .initial-loader-status {
          font-size: 9px;
        }
      }
    </style>
  </head>

  <body>
    <!--
      This loader exists OUTSIDE #root, so React cannot remove it
      immediately. It fades only after React has mounted and the
      minimum display time has elapsed.
    -->
    <div
      id="pulseops-initial-loader"
      role="status"
      aria-live="polite"
      aria-label="PulseOps is loading"
    >
      <div
        class="initial-loader-grid"
        aria-hidden="true"
      ></div>

      <div class="initial-loader-center">
        <div
          class="initial-loader-orbit"
          aria-hidden="true"
        >
          <span class="initial-loader-ring ring-one"></span>
          <span class="initial-loader-ring ring-two"></span>
          <span class="initial-loader-ring ring-three"></span>

          <div class="initial-loader-mark">
            <svg viewBox="0 0 64 64">
              <path
                class="initial-loader-heartbeat"
                d="M4 34H15L20 23L27 46L34 13L41 40L47 29H60"
              ></path>
            </svg>
          </div>
        </div>

        <div class="initial-loader-brand">
          PULSE<span>OPS</span>
        </div>

        <div class="initial-loader-status">
          INITIALIZING OPERATIONS CONTROL
        </div>

        <div
          class="initial-loader-progress"
          aria-hidden="true"
        >
          <span></span>
        </div>

        <div class="initial-loader-meta">
          <span>
            AUTH <strong>SYNC</strong>
          </span>

          <i class="initial-loader-dot"></i>

          <span>
            API <strong>LINK</strong>
          </span>

          <i class="initial-loader-dot"></i>

          <span>
            NOC <strong>READY</strong>
          </span>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (() => {
        const loader =
          document.getElementById(
            "pulseops-initial-loader"
          );

        const root =
          document.getElementById("root");

        const startedAt =
          performance.now();

        const minimumVisibleMs = 1100;

        let reactMounted = false;
        let removed = false;

        const removeLoader = () => {
          if (removed || !loader) {
            return;
          }

          removed = true;

          const elapsed =
            performance.now() -
            startedAt;

          const wait =
            Math.max(
              minimumVisibleMs - elapsed,
              0
            );

          window.setTimeout(() => {
            loader.classList.add(
              "is-leaving"
            );

            window.setTimeout(() => {
              loader.remove();
            }, 300);
          }, wait);
        };

        const observer =
          new MutationObserver(() => {
            if (
              root &&
              root.childNodes.length > 0
            ) {
              reactMounted = true;
              observer.disconnect();
              removeLoader();
            }
          });

        if (root) {
          observer.observe(root, {
            childList: true,
          });
        }

        /*
          Fallback: if React has a runtime error, do not leave
          the boot overlay stuck forever.
        */
        window.setTimeout(() => {
          if (!reactMounted) {
            observer.disconnect();
            removeLoader();
          }
        }, 8000);
      })();
    </script>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
